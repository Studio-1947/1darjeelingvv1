# CSP for the public tourist/provider SPA (location / and its /static/ sub-location).
#
# 'unsafe-inline' is granted to styles because the CRA/Tailwind build injects them at runtime;
# scripts do NOT get it, so an injected <script> still cannot execute.
#
# connect-src is 'self' because the bundle is built with no absolute API host on purpose (see
# deploy/nginx/Dockerfile) — every call is same-origin. Razorpay is listed explicitly since
# checkout loads as a script and opens a frame.
#
# frame-src MUST include openstreetmap.org: MapEmbed.tsx renders the location map on every listing
# detail page as an <iframe> to their embed endpoint. Omitting it silently blanks the map — the
# page still renders, so it is easy to ship and not notice.
#
# img-src keeps a broad `https:` because listing photos come from wherever a provider or admin
# sourced them (Cloudinary, Pexels, Unsplash, TripAdvisor, MinIO...). Enumerating those hosts would
# mean a listing silently losing its photo whenever someone used a new one, which is a worse
# failure than the one a narrow img-src prevents.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
