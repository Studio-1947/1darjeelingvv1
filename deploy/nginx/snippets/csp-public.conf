# CSP for the public tourist/provider SPA (location / and its /static/ sub-location).
#
# 'unsafe-inline' is granted to styles because the CRA/Tailwind build injects them at runtime;
# scripts do NOT get it, so an injected <script> still cannot execute.
#
# connect-src is 'self' because the bundle is built with no absolute API host on purpose (see
# deploy/nginx/Dockerfile)  every call is same-origin. Razorpay is listed explicitly since
# checkout loads as a script and opens a frame.
#
# frame-src MUST include openstreetmap.org: MapEmbed.tsx renders the location map on every listing
# detail page as an <iframe> to their embed endpoint. Omitting it silently blanks the map  the
# page still renders, so it is easy to ship and not notice.
#
# img-src keeps a broad `https:` because listing photos come from wherever a provider or admin
# sourced them (Cloudinary, Pexels, Unsplash, TripAdvisor, MinIO...). Enumerating those hosts would
# mean a listing silently losing its photo whenever someone used a new one, which is a worse
# failure than the one a narrow img-src prevents.
#
# Google Analytics (GA4): the tag loads from googletagmanager.com and reports to
# google-analytics.com / analytics.google.com, so those are in script-src and connect-src. Its
# setup lives in /gtag-init.js (covered by 'self'), never inline. Without these hosts the tag was
# blocked on every page and no visits were counted.
#
# connect-src also has fonts.googleapis.com: the About page gallery (CircularGallery.jsx) fetches
# its font stylesheet to draw text on a canvas.
#
# connect-src also has api.open-meteo.com: the weather box (WeatherForecast.tsx, in the Feed and on
# listing pages) fetches the forecast straight from Open-Meteo. Without it the box stays empty on
# the live site only, since the dev server sends no CSP. csp.test.js checks every fetched host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://fonts.googleapis.com https://fonts.gstatic.com https://api.open-meteo.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
