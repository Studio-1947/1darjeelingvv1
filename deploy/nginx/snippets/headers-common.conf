# Security + caching headers shared by every location that serves static files: the public SPA at
# /, the admin SPA at /admin/, and the content-hashed asset sub-location of each.
#
# This is a snippet rather than five lines repeated four times because nginx's add_header does NOT
# inherit into a location that declares any add_header of its own. Every static location therefore
# has to restate the FULL set, and four hand-maintained copies is exactly how one of them silently
# ends up missing a header after an edit.
#
# Snippets live in /etc/nginx/snippets and deliberately NOT in /etc/nginx/conf.d: the stock
# nginx.conf auto-includes conf.d/*.conf at http level, so a snippet dropped there would be applied
# globally — to the /api proxy responses too, which already set these headers in Express.
#
# `always` is what attaches them to error responses (the =404s below included), not just 2xx.

# Empty (so omitted entirely by nginx) on the canonical domain, "noindex, nofollow" everywhere
# else. See the $robots_tag map in app.conf.
add_header X-Robots-Tag $robots_tag always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Computed by the $cache_control map in app.conf: "no-cache" for HTML entry points and unhashed
# files, one year + immutable for content-hashed bundles.
#
# The ONLY header here deliberately WITHOUT `always`, which is what restricts it to success
# statuses (2xx/3xx, 304 included). A 404 is a cacheable status, so letting the immutable value
# attach to one would tell the browser to remember "this asset does not exist" for a year — and a
# request that lands in the window where a deploy has swapped index.html but not yet finished
# writing the new bundles would then be stuck on a broken page permanently, which is a far worse
# failure than the blank console this whole block exists to fix. Without the directive nginx's 404
# carries no Last-Modified or Expires either, so there is nothing for heuristic caching to work
# from and the response is effectively not stored.
add_header Cache-Control $cache_control;
