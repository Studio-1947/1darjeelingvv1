# CSP for the admin console (location /admin/ and its /admin/assets/ sub-location).
#
# Stricter than the public SPA's: the admin bundle loads no third-party script and talks to nothing
# but its own origin, so nothing needs to be allow-listed. 'unsafe-inline' is granted to styles
# only because the Vite/Tailwind build injects them at runtime; scripts do NOT get it, so an
# injected <script> still cannot execute.
#
# Kept in a snippet so the two admin locations cannot drift to different policies — the asset
# location silently running a weaker CSP than the document location would be hard to spot.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
