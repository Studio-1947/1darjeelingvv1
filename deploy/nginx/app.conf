# This nginx runs INSIDE Docker, bound to 127.0.0.1 only (see
# docker-compose.prod.yml) — it never talks TLS and is never reachable from
# outside the VPS directly. The VPS's existing system Nginx (already fronting
# every other app on this box) terminates HTTPS and reverse-proxies
# onedarjeeling.duckdns.org to this container's port, exactly like it does
# for the other projects sharing this server. See README's "Production
# deployment" section for the host-side Nginx + Certbot setup.

# --- Which hostname is the real site? ---
#
# The SAME image is built and deployed to BOTH stacks (docker-compose.prod.yml serves
# onedarjeeling.duckdns.org, docker-compose.in.yml serves 1darjeeling.in), so this one file has to
# behave differently depending on which host the request arrived for. Without that, two byte-identical
# copies of the site are publicly crawlable, Google treats them as duplicates, and the ranking that
# should belong to 1darjeeling.in is split with a duckdns subdomain.
#
# The rule is inverted on purpose: the canonical domain is named explicitly and EVERYTHING ELSE gets
# noindex. A new staging host, a preview deployment, or someone hitting the VPS by raw IP is then
# non-indexable by default rather than by remembering to add it here.
#
# nginx omits an add_header whose value evaluates to an empty string, so the canonical domain sends
# no X-Robots-Tag at all — not "index", which would be a weaker signal than sending nothing.
map $host $robots_tag {
    ~*^(www\.)?aaganerp\.in$      "";
    default                       "noindex, nofollow";
}

# NOTE: deliberately NOT paired with a `Disallow: /` robots.txt for the staging host. That is the
# classic mistake — Disallow stops the crawler fetching the page, which means it never SEES the
# noindex header, and an already-indexed URL stays indexed indefinitely. Crawling must stay allowed
# for noindex to be read and obeyed.

# --- How long may a browser reuse a file without asking? ---
#
# Both SPAs are content-hashed builds: the entry HTML is a fixed URL (/index.html, /admin/index.html)
# that points at bundles whose FILENAMES change every deploy (/static/js/main.<hash>.js,
# /admin/assets/index-<hash>.js). That split is only safe if the two get opposite cache policies,
# and previously neither got any Cache-Control at all.
#
# A response with no Cache-Control is not "uncached" — it is HEURISTICALLY cached. The browser is
# free to invent a freshness lifetime (commonly 10% of the document's age at the time it was
# stored) and reuse the file without revalidating. So a returning admin replayed the index.html
# they cached BEFORE a deploy, which referenced bundle filenames the new deploy had already
# deleted. The request for the dead bundle then hit the SPA fallback and came back as index.html
# with `Content-Type: text/html` and a 200 — and because these locations also send nosniff and a
# `script-src 'self'` CSP, the browser refused to execute HTML as a module script and stopped. No
# console-visible cause, no error page: just a permanently blank admin console until the heuristic
# lifetime happened to expire. The =404 on the asset locations below closes the other half of that
# trap, so a stale reference fails loudly as a missing file instead of masquerading as a document.
#
# $uri (not $request_uri) on purpose: try_files' fallback performs an INTERNAL REDIRECT, which
# rewrites $uri. A deep link like /admin/kyc is therefore evaluated here as /admin/index.html and
# correctly picks up "no-cache", which is exactly the behaviour wanted.
map $uri $cache_control {
    # Deliberately the default rather than an explicit HTML pattern: anything NOT proven immutable
    # by a content hash must revalidate. That covers both index.html files and the unhashed root
    # files CRA copies verbatim from frontend/public (error-shim.js, manifest.json, logo.svg,
    # favicon.ico, the *.webp portraits...), whose URLs are stable across deploys while their
    # CONTENTS are not — precisely the combination that must never be cached blind.
    #
    # "no-cache" does not mean "do not store": it means store it, but revalidate before reuse.
    # Paired with the ETag nginx already emits, the usual outcome is a 304 with an empty body.
    default           "no-cache";

    # Content-hashed build output. The hash IS the cache key — any content change produces a
    # different filename — so these can be pinned for a year. `immutable` additionally suppresses
    # the revalidation request browsers would otherwise send on a manual reload.
    ~^/static/        "public, max-age=31536000, immutable";
    ~^/assets/        "public, max-age=31536000, immutable";
    ~^/admin/assets/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name onedarjeeling.duckdns.org;

    # Uploads (listing images, KYC docs) are sent as base64 JSON, ~33% larger than the raw file,
    # so this must clear the largest upload's on-the-wire size: a 20MB listing image is ~27MB
    # encoded. Kept a notch above the backend's express.json('28mb') limit so oversized uploads are
    # rejected by the app (a clean JSON 400/413 with a detail) rather than by nginx's bare HTML 413.
    client_max_body_size 30m;

    # Docker's embedded DNS. Combined with a variable in proxy_pass (below),
    # this makes nginx re-resolve "backend" at request time instead of once
    # at startup — so it doesn't fail to boot if the backend container isn't
    # up yet, and doesn't cache a stale IP after backend gets recreated on
    # a redeploy.
    resolver 127.0.0.11 valid=10s;

    # Bare /api (no trailing slash) doesn't match the /api/ prefix location
    # below, so it'd otherwise fall through to the frontend's catch-all and
    # 301 to /api/ before reaching the backend. Nothing in the app ever calls
    # bare /api except the health-check convenience route, but handle it
    # directly rather than relying on that extra redirect hop.
    location = /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — Express already mounts routes under /api/..., so the
    # full request path is forwarded as-is (no rewrite).
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger docs live at /api-docs (not under /api), mounted separately in app.ts.
    location /api-docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare /admin, with no trailing slash — the form a human actually types.
    #
    # nginx prefix matching is literal, so "/admin" does NOT match `location /admin/` and instead
    # falls through to the public SPA's catch-all, which answers it with the PUBLIC site's
    # index.html and a 200. The result is the tourist app rendering at /admin: no error status to
    # notice, no redirect, just the wrong application. nginx's own automatic add-the-slash redirect
    # never fires because try_files resolves the request before the directory-index step is reached.
    #
    # `absolute_redirect off` keeps the Location header relative. This nginx sits behind the VPS's
    # system Nginx, which terminates TLS and proxies over plain HTTP, so $scheme in here is "http";
    # an absolute redirect would bounce an HTTPS visitor to http://1darjeeling.in/admin/ and
    # downgrade the connection.
    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }

    # Content-hashed admin bundle (Vite emits dist/assets/index-<hash>.{js,css}).
    #
    # MUST be declared as its own location, and must end in `=404`. Under the SPA fallback below, a
    # request for a bundle filename that no longer exists returns index.html with a 200 and
    # Content-Type: text/html — the browser then refuses to execute it as a module script and the
    # console renders blank with nothing in the log to explain why. A 404 here makes a stale or
    # mistyped asset reference fail as what it actually is: a missing file.
    #
    # nginx picks the LONGEST matching prefix regardless of declaration order, so this wins over
    # `location /admin/` for asset requests while everything else still falls through to the SPA.
    location /admin/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        include /etc/nginx/snippets/headers-common.conf;
        include /etc/nginx/snippets/csp-admin.conf;
    }

    # Admin SPA (Vite build), served under /admin — built with base '/admin/'.
    #
    # `root` rather than `alias`: with the location prefix (/admin/) equal to the trailing path
    # component of the directory, root maps /admin/x to /usr/share/nginx/html/admin/x identically,
    # and avoids the long-standing nginx footgun where try_files inside an aliased location
    # resolves $uri against the wrong base.
    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;

        # Headers are included per-location rather than declared once at server level — see the
        # note in `location /` for why. The admin console is the higher-value target of the two
        # SPAs, so it must not be the one that goes without.
        include /etc/nginx/snippets/headers-common.conf;
        include /etc/nginx/snippets/csp-admin.conf;
    }

    # --- Object storage: PUBLIC bucket only ---
    #
    # MinIO holds two buckets and they must never be reachable through the same path prefix:
    #   - MINIO_BUCKET (default "one-darjeeling", see backend/src/config.ts) is PUBLIC — listing
    #     images. uploadToMinIO() returns URLs shaped ${MINIO_PUBLIC_URL}/${MINIO_BUCKET}/<key>,
    #     so browsers fetch this path directly. That's what the location below serves.
    #   - MINIO_KYC_BUCKET (default "one-darjeeling-kyc") is PRIVATE — Aadhaar/PAN/licence scans.
    #     It has NO public-read policy and must be reached ONLY through the authenticated backend
    #     route GET /api/providers/kyc/:id/file. Do NOT add an nginx location for it, "for
    #     symmetry" or otherwise — that would leak government ID documents to the internet.
    #
    # The bucket name in this path is coupled to MINIO_BUCKET: if that env var is ever changed,
    # this location (and the deny block below) must be updated to match, or public images 404.
    #
    # Matches only the PUBLIC bucket prefix. nginx prefix matching is exact-segment: a request for
    # /one-darjeeling-kyc/... does NOT fall into /one-darjeeling/ because the next character after
    # the prefix is "-", not "/" — nginx location matching operates on the literal string, so
    # "/one-darjeeling-kyc/x" simply doesn't start with "/one-darjeeling/". Still, the KYC deny
    # below is kept as belt-and-braces in case the bucket names ever change.
    location /one-darjeeling/ {
        # Objects are fetched, never written, through this path — uploads go through the
        # authenticated backend (POST /api/listings/upload for providers, POST
        # /api/admin/spots/upload for admin-curated tourist spots), never directly to MinIO. Reject
        # anything but GET/HEAD so this proxy can't be used to write/delete objects in the
        # public bucket even if MinIO's own auth were ever misconfigured.
        limit_except GET HEAD {
            deny all;
        }
        # Listing photos are indexable by Google Images in their own right, so the staging copy
        # needs the same treatment as its HTML or the pictures get indexed under the wrong domain.
        add_header X-Robots-Tag $robots_tag always;

        # Object keys are `<uuid>.<ext>` (backend/src/lib/imageUpload.ts) and are never reused, so
        # a URL here always returns the same bytes — the precondition `immutable` asks for.
        #
        # Set here as well as at upload time (PutObjectCommand in backend/src/lib/s3.ts) because
        # this is what covers the objects already in the bucket, which carry no Cache-Control at
        # all and therefore fall to heuristic caching — the browser inventing a lifetime for a
        # full-size photo. proxy_hide_header first so the two can never both appear: add_header
        # APPENDS, and a response carrying two different Cache-Controls is resolved by the most
        # restrictive, silently undoing this.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defense-in-depth: explicitly block the private KYC bucket path even though the public
    # location above cannot match it. Placed after the public location but matched first by nginx
    # (longer/more specific prefixes take priority over shorter ones regardless of file order), so
    # this cannot be bypassed by the public rule above. If someone ever renames MINIO_BUCKET to a
    # prefix of MINIO_KYC_BUCKET, or loosens the location above to a broader pattern, this still
    # blocks it.
    location /one-darjeeling-kyc/ {
        return 404;
    }

    # Public tourist/provider SPA (CRA build), served at root.
    #
    # The security headers are pulled in per static location via snippets rather than declared
    # once at server level, and that is deliberate on two counts. First, nginx's add_header does
    # NOT inherit into a location that declares any add_header of its own, so a server-level
    # declaration is a trap the moment one location adds a header. Second, the /api and /api-docs
    # locations proxy to Express, which already sets these itself (see app.ts) — a server-level
    # rule would append a second copy of every one of them to every API response.
    #
    # The snippets exist because that first constraint forces all four static locations to restate
    # the full header set; keeping the text in one file is what stops them drifting apart. See
    # deploy/nginx/snippets/headers-common.conf.
    #
    # Before this, only Express's responses carried them: the HTML, JS and CSS that actually run
    # in the browser were served bare, with no clickjacking, MIME-sniffing or referrer protection.
    # Content-hashed public bundle (CRA emits build/static/{js,css}/main.<hash>.*).
    # Same reasoning as /admin/assets/ above: `=404` so a stale bundle reference fails as a missing
    # file rather than being answered with index.html and a 200.
    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        include /etc/nginx/snippets/headers-common.conf;
        include /etc/nginx/snippets/csp-public.conf;
    }

    # Content-hashed public bundle (Vite emits dist/assets/index-<hash>.*).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        include /etc/nginx/snippets/headers-common.conf;
        include /etc/nginx/snippets/csp-public.conf;
    }

    # --- Two known limits of serving a single-page app as static files ---
    #
    # Both are recorded here rather than in the app, because neither can be fixed from inside the
    # bundle and both were raised in QA (3.4 and 2.5). frontend/src/components/Seo.tsx and
    # frontend/src/pages/NotFound.tsx point at this note.
    #
    # 1. LINK PREVIEWS IN CHAT APPS. Seo.tsx writes <title>, description, canonical and the
    #    og:*/twitter:* tags per route, which is enough for Google — it executes JavaScript. It is
    #    NOT enough for WhatsApp, Facebook or iMessage: their crawlers fetch this index.html and
    #    read the raw markup, so every shared listing previews as the generic site description in
    #    public/index.html. Fixing it properly means detecting those user agents here and proxying
    #    them to a backend route that renders the tags server-side, e.g.
    #
    #        map $http_user_agent $is_social_crawler { default 0; ~*(facebookexternalhit|WhatsApp|Twitterbot|Slackbot|TelegramBot|LinkedInBot|Discordbot|iMessageBot) 1; }
    #
    #    then, inside `location /`, routing $is_social_crawler requests for /listing/* to a
    #    backend endpoint that emits a minimal HTML document with the right og:* values. That
    #    endpoint does not exist yet — building it is the remaining half of QA 3.4, and it needs a
    #    backend change, not an nginx one.
    #
    # 2. NO REAL 404 STATUS. try_files answers EVERY unmatched path with index.html and a 200, so
    #    /some-random-404-xyz is a 200 as far as this server, any uptime monitor, and any crawler
    #    is concerned. The app now renders a proper not-found page with `noindex` on it, which is
    #    what actually keeps these out of the index; the status code would need nginx to know the
    #    app's route table, which means either enumerating the routes here (and re-editing this
    #    file every time one is added) or having the backend answer unknown paths. Neither is
    #    worth it before the crawler work above, which would give us the same server-side hook.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

        include /etc/nginx/snippets/headers-common.conf;
        include /etc/nginx/snippets/csp-public.conf;
    }
}
