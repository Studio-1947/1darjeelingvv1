        <meta charset="utf-8" />

        <meta name="description" content="aangan  By studio 1947. Tourism spots, homestays, drivers, cafes, cultural events and Himalayan biodiversity in a single app." />
        <!-- Link previews: what WhatsApp and other apps show when an aangan link is shared,
             including the app's referral invite. The image is 1200x630, the size they expect. -->

        <meta property="og:site_name" content="aangan" />
        <meta property="og:url" content="https://aangan.in" />
        <meta property="og:title" content="aangan: Darjeeling, booked with the locals" />
        <meta property="og:description" content="Homestays, local drivers, cafes and places to see in the Darjeeling hills, in one app." />
        <meta property="og:image" content="https://res.cloudinary.com/drgb8w8ak/image/upload/w_1200,h_630,c_fill,q_auto,f_jpg/v1784109903/tigerhill_mcmhxp.webp" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="/favicon-v2.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="aangan" />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>aangan  By studio 1947</title>
        <script src="/error-shim.js"></script>
        <!-- Inlined rather than relying on the bundled stylesheet: in dev, Vite injects CSS via
             JS, so it isn't applied yet at this point; this has to work before any bundle runs. -->
        <style>
            #app-splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding-top: 16vh;
                background: #2C5E3B url(/loading.webp) center/cover no-repeat;
                color: #fff;
                transition: opacity 0.3s ease;
            }
            /* The app icon, the same tile as the Play Store and home-screen icon. */
            #app-splash img {
                width: 34vw;
                max-width: 160px;
                height: auto;
                border-radius: 22%;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            }
            #app-splash.app-splash-hide { opacity: 0; pointer-events: none; }
            @media (prefers-reduced-motion: no-preference) {
                #app-splash img { opacity: 0; transform: scale(0.85); animation: icon-in 0.7s ease-out 0.1s forwards; }
            }
            @keyframes icon-in { to { opacity: 1; transform: scale(1); } }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <!-- Removed by App.tsx once the app has mounted (and the hand-drawn reveal has had time
             to play). Kept out of the React tree since its whole job is to cover the gap before
             React exists. -->
        <div id="app-splash" aria-hidden="true">
            <img src="/favicon-v2.svg" alt="" width="160" height="160" />
        </div>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
